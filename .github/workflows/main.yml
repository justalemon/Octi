on:
  release:
    types:
      - created
  push:
  pull_request:
  workflow_dispatch:

permissions:
  # pages
  pages: write
  # releases
  contents: write
  # ghcr.io
  packages: write
  # idk what this is but actions/deploy-pages needs it
  id-token: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "10"
          run_install: false
          standalone: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.x"
          cache: pnpm
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: "4.0.7"
      - uses: justalemon/VersionPatcher@v0.10
        with:
          version: 0.0.1.alpha.${{ github.run_number }}
          gemspec-files: "*.gemspec"
      - run: pnpm install
      - run: pnpm build
      - run: gem build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ github.event.repository.name }}
          path: "*.gem"
          if-no-files-found: error
  ghcr:
    runs-on: ubuntu-26.04
    needs:
      - build
    if: ${{ format('refs/heads/{0}', github.event.repository.default_branch) == github.ref || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ github.event.repository.name }}
          path: .
      - run: "mkdir -p ~/.gem && printf -- '---\n:github: ${{ github.token }}\n' > ~/.gem/credentials && chmod 0600 ~/.gem/credentials"
      - run: gem push --key github --host https://rubygems.pkg.github.com/${{ github.repository_owner }} *.gem
  deploy:
    runs-on: ubuntu-26.04
    needs:
      - build
    if: ${{ format('refs/heads/{0}', github.event.repository.default_branch) == github.ref || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: "4.0.7"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ github.event.repository.name }}
          path: .
      - run: gem install *.gem
      - run: gem install csv json:'~>2.21.2' bigdecimal rake # Change from Ruby 3 to Ruby 4
      - run: jekyll build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "_site"
      - uses: actions/deploy-pages@v5.0.1
